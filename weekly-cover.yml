name: Rotate Notion cover weekly

on:
  schedule:
    - cron: '17 9 * * 0'
      timezone: 'America/New_York'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rotate-cover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out images and script
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rotate Notion cover
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ vars.NOTION_PAGE_ID }}
        run: python rotate_cover.py
